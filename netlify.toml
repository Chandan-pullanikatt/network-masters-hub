[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NEXT_PUBLIC_STRAPI_URL = "https://network-masters-hub-pkkk.onrender.com"
  # STRAPI_API_TOKEN must be added via Netlify Dashboard → Site configuration → Environment variables
  # Never put the actual token value here as this file is in a public git repo
